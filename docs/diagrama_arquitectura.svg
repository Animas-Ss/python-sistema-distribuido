<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra y efectos -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradientes -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>

    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="lbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="queueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="s3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Marcadores de flechas -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fb923c"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-weight: 800; font-size: 26px; fill: #f8fafc; }
    .subtitle { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 14px; fill: #94a3b8; }
    .header-box { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-weight: 700; font-size: 16px; fill: #ffffff; }
    .text-detail { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 12px; fill: #e2e8f0; }
    .badge { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
    .layer-title { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-weight: 700; font-size: 14px; fill: #64748b; letter-spacing: 1.5px; }
    .conn-label { font-family: 'Segoe UI', Inter, system-ui, sans-serif; font-size: 11px; fill: #94a3b8; font-weight: 500; }
  </style>

  <!-- Fondo Principal -->
  <rect width="1100" height="850" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="1096" height="846" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Título del Diagrama -->
  <text x="550" y="48" text-anchor="middle" class="title">ARQUITECTURA DE SISTEMA DISTRIBUIDO</text>
  <text x="550" y="74" text-anchor="middle" class="subtitle">PFO 3 - Cliente/Servidor con Sockets, Worker Pool, RabbitMQ y Almacenamiento Distribuido</text>

  <!-- ================= CAPAS DECORATIVAS DE FONDO ================= -->
  <!-- Capa 1: Clientes -->
  <rect x="40" y="105" width="220" height="420" rx="12" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="4 4"/>
  <text x="150" y="132" text-anchor="middle" class="layer-title">CAPA CLIENTES</text>

  <!-- Capa 2: Load Balancing -->
  <rect x="295" y="105" width="170" height="420" rx="12" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="4 4"/>
  <text x="380" y="132" text-anchor="middle" class="layer-title">BALANCEADOR</text>

  <!-- Capa 3: Servidores Workers -->
  <rect x="500" y="105" width="295" height="420" rx="12" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="4 4"/>
  <text x="647" y="132" text-anchor="middle" class="layer-title">SERVIDORES WORKERS</text>

  <!-- Capa 4: Message Queue -->
  <rect x="830" y="105" width="230" height="420" rx="12" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="4 4"/>
  <text x="945" y="132" text-anchor="middle" class="layer-title">COLA DE MENSAJES</text>

  <!-- Capa 5: Storage -->
  <rect x="40" y="565" width="1020" height="245" rx="12" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-dasharray="4 4"/>
  <text x="550" y="595" text-anchor="middle" class="layer-title">CAPA DE ALMACENAMIENTO DISTRIBUIDO Y PERSISTENCIA</text>


  <!-- ================= COMPONENTES ================= -->

  <!-- Clientes Móviles -->
  <g filter="url(#card-shadow)">
    <rect x="60" y="160" width="180" height="130" rx="10" fill="url(#clientGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="150" y="195" text-anchor="middle" class="header-box">Clientes Móviles</text>
    <text x="150" y="215" text-anchor="middle" class="badge">iOS / Android App</text>
    <line x1="80" y1="225" x2="220" y2="225" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="150" y="247" text-anchor="middle" class="text-detail">• Conexión Socket TCP / WSS</text>
    <text x="150" y="267" text-anchor="middle" class="text-detail">• Envío de tareas móviles</text>
  </g>

  <!-- Clientes Web -->
  <g filter="url(#card-shadow)">
    <rect x="60" y="340" width="180" height="130" rx="10" fill="url(#clientGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="150" y="375" text-anchor="middle" class="header-box">Clientes Web</text>
    <text x="150" y="395" text-anchor="middle" class="badge">SPA / Browser / API Client</text>
    <line x1="80" y1="405" x2="220" y2="405" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="150" y="427" text-anchor="middle" class="text-detail">• WebSockets / TCP Client</text>
    <text x="150" y="447" text-anchor="middle" class="text-detail">• Interfaz y recepción asíncrona</text>
  </g>

  <!-- Balanceador de Carga (Nginx / HAProxy) -->
  <g filter="url(#card-shadow)">
    <rect x="310" y="200" width="140" height="230" rx="10" fill="url(#lbGrad)" stroke="#34d399" stroke-width="1.5"/>
    <text x="380" y="240" text-anchor="middle" class="header-box">Load Balancer</text>
    <text x="380" y="265" text-anchor="middle" class="badge">Nginx / HAProxy</text>
    <line x1="325" y1="280" x2="435" y2="280" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="380" y="305" text-anchor="middle" class="text-detail">• Round-Robin / LeastConn</text>
    <text x="380" y="327" text-anchor="middle" class="text-detail">• Proxy Reverso TCP Sockets</text>
    <text x="380" y="349" text-anchor="middle" class="text-detail">• Terminación SSL/TLS</text>
    <text x="380" y="371" text-anchor="middle" class="text-detail">• Health Checks activos</text>
    <text x="380" y="393" text-anchor="middle" class="text-detail">• Alta disponibilidad (HA)</text>
  </g>

  <!-- Servidor Worker Nodo 1 -->
  <g filter="url(#card-shadow)">
    <rect x="520" y="160" width="255" height="150" rx="10" fill="url(#workerGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="647" y="190" text-anchor="middle" class="header-box">Servidor Worker #1 (Python)</text>
    <text x="647" y="210" text-anchor="middle" class="badge">Socket Server + ThreadPool</text>
    <line x1="535" y1="220" x2="760" y2="220" stroke="#818cf8" stroke-opacity="0.5"/>

    <!-- Subcomponentes internos de Worker 1: Hilos -->
    <rect x="535" y="230" width="65" height="35" rx="6" fill="#312e81" stroke="#a5b4fc"/>
    <text x="567" y="252" text-anchor="middle" class="badge">Hilo 1</text>

    <rect x="615" y="230" width="65" height="35" rx="6" fill="#312e81" stroke="#a5b4fc"/>
    <text x="647" y="252" text-anchor="middle" class="badge">Hilo 2</text>

    <rect x="695" y="230" width="65" height="35" rx="6" fill="#312e81" stroke="#a5b4fc"/>
    <text x="727" y="252" text-anchor="middle" class="badge">Hilo N</text>

    <text x="647" y="295" text-anchor="middle" class="text-detail">ThreadPoolExecutor (Ejecución Concurrente)</text>
  </g>

  <!-- Servidor Worker Nodo 2 -->
  <g filter="url(#card-shadow)">
    <rect x="520" y="335" width="255" height="150" rx="10" fill="url(#workerGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="647" y="365" text-anchor="middle" class="header-box">Servidor Worker #2 (Python)</text>
    <text x="647" y="385" text-anchor="middle" class="badge">Socket Server + ThreadPool</text>
    <line x1="535" y1="395" x2="760" y2="395" stroke="#818cf8" stroke-opacity="0.5"/>

    <!-- Subcomponentes internos de Worker 2: Hilos -->
    <rect x="535" y="405" width="65" height="35" rx="6" fill="#312e81" stroke="#a5b4fc"/>
    <text x="567" y="427" text-anchor="middle" class="badge">Hilo 1</text>

    <rect x="615" y="405" width="65" height="35" rx="6" fill="#312e81" stroke="#a5b4fc"/>
    <text x="647" y="427" text-anchor="middle" class="badge">Hilo 2</text>

    <rect x="695" y="405" width="65" height="35" rx="6" fill="#312e81" stroke="#a5b4fc"/>
    <text x="727" y="427" text-anchor="middle" class="badge">Hilo N</text>

    <text x="647" y="470" text-anchor="middle" class="text-detail">ThreadPoolExecutor (Ejecución Concurrente)</text>
  </g>

  <!-- Cola de Mensajes: RabbitMQ -->
  <g filter="url(#card-shadow)">
    <rect x="850" y="200" width="190" height="230" rx="10" fill="url(#queueGrad)" stroke="#fb923c" stroke-width="1.5"/>
    <text x="945" y="235" text-anchor="middle" class="header-box">RabbitMQ</text>
    <text x="945" y="258" text-anchor="middle" class="badge">Message Broker Distribuido</text>
    <line x1="865" y1="272" x2="1025" y2="272" stroke="#fb923c" stroke-opacity="0.5"/>
    <text x="945" y="297" text-anchor="middle" class="text-detail">• Comunicación entre Nodos</text>
    <text x="945" y="319" text-anchor="middle" class="text-detail">• Colas de Tareas Asíncronas</text>
    <text x="945" y="341" text-anchor="middle" class="text-detail">• Patrón Pub/Sub y Fanout</text>
    <text x="945" y="363" text-anchor="middle" class="text-detail">• Reintentos (Dead Letter Queue)</text>
    <text x="945" y="385" text-anchor="middle" class="text-detail">• Buffer para picos de carga</text>
    <text x="945" y="407" text-anchor="middle" class="text-detail">• Desacople Total de Servicios</text>
  </g>

  <!-- Almacenamiento: PostgreSQL -->
  <g filter="url(#card-shadow)">
    <rect x="180" y="625" width="340" height="155" rx="10" fill="url(#dbGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="350" y="660" text-anchor="middle" class="header-box">PostgreSQL Cluster</text>
    <text x="350" y="682" text-anchor="middle" class="badge">Base de Datos Relacional Distribuida</text>
    <line x1="200" y1="695" x2="500" y2="695" stroke="#c084fc" stroke-opacity="0.5"/>
    <text x="350" y="720" text-anchor="middle" class="text-detail">• Registro de tareas, estados (PENDING, SUCCESS, ERROR)</text>
    <text x="350" y="740" text-anchor="middle" class="text-detail">• Métricas de rendimiento, tiempos de ejecución y usuarios</text>
    <text x="350" y="760" text-anchor="middle" class="text-detail">• Replicación Primario / Standby con consistencia ACID</text>
  </g>

  <!-- Almacenamiento: S3 Object Storage -->
  <g filter="url(#card-shadow)">
    <rect x="580" y="625" width="340" height="155" rx="10" fill="url(#s3Grad)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="750" y="660" text-anchor="middle" class="header-box">Amazon S3 / MinIO</text>
    <text x="750" y="682" text-anchor="middle" class="badge">Almacenamiento de Objetos Distribuido</text>
    <line x1="600" y1="695" x2="900" y2="695" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="750" y="720" text-anchor="middle" class="text-detail">• Almacenamiento de datasets, payloads grandes y binarios</text>
    <text x="750" y="740" text-anchor="middle" class="text-detail">• Archivos de resultados y logs de auditoría masivos</text>
    <text x="750" y="760" text-anchor="middle" class="text-detail">• Escalabilidad ilimitada y alta durabilidad (99.999999999%)</text>
  </g>


  <!-- ================= LÍNEAS DE CONEXIÓN Y FLUJOS ================= -->

  <!-- Clientes -> Load Balancer -->
  <path d="M 240 225 L 310 270" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 240 405 L 310 350" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="260" y="275" class="conn-label">TCP / Sockets</text>

  <!-- Load Balancer -> Workers -->
  <path d="M 450 280 L 520 230" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 450 340 L 520 390" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <text x="455" y="320" class="conn-label">Balanceo</text>

  <!-- Workers <-> RabbitMQ -->
  <path d="M 775 235 L 850 275" stroke="#fb923c" stroke-width="2.5" stroke-dasharray="4 2" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M 850 355 L 775 395" stroke="#fb923c" stroke-width="2.5" stroke-dasharray="4 2" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="785" y="315" class="conn-label">Pub / Sub</text>

  <!-- Workers -> PostgreSQL -->
  <path d="M 600 485 L 430 625" stroke="#a78bfa" stroke-width="2.2" stroke-dasharray="4 2" fill="none" marker-end="url(#arrow-purple)"/>
  <text x="460" y="550" class="conn-label">SQL / Metadata</text>

  <!-- Workers -> S3 -->
  <path d="M 700 485 L 720 625" stroke="#fbbf24" stroke-width="2.2" stroke-dasharray="4 2" fill="none" marker-end="url(#arrow-purple)"/>
  <text x="725" y="555" class="conn-label">Payloads / S3 API</text>

</svg>
